{% extends "base.html" %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">
        <h3 class="text-center">Change Password</h3>
        {% if current_user.is_authenticated and current_user.get_id() in session.get('temp_password_users', []) %}
        <div class="alert alert-warning mt-3">
          <i class="fas fa-exclamation-triangle"></i> You are using a temporary password. Please change it now.
        </div>
        {% endif %}
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('change_password') }}">
          <div class="mb-3">
            <label for="current_password" class="form-label">Current Password</label>
            <input
              type="password"
              class="form-control"
              id="current_password"
              name="current_password"
              required
            />
          </div>
          <div class="mb-3">
            <label for="new_password" class="form-label">New Password</label>
            <input
              type="password"
              class="form-control"
              id="new_password"
              name="new_password"
              required
            />
          </div>
          <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirm New Password</label>
            <input
              type="password"
              class="form-control"
              id="confirm_password"
              name="confirm_password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary w-100">Change Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
