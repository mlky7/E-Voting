{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3>Edit Election</h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" 
                                   value="{{ election.title }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" 
                                      rows="3" required>{{ election.description }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="start_date" class="form-label">Start Date</label>
                            <input type="date" class="form-control" id="start_date" name="start_date" 
                                   value="{{ election.start_date.strftime('%Y-%m-%d') }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="end_date" class="form-label">End Date</label>
                            <input type="date" class="form-control" id="end_date" name="end_date" 
                                   value="{{ election.end_date.strftime('%Y-%m-%d') }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="active" {% if election.status == 'active' %}selected{% endif %}>Active</option>
                                <option value="completed" {% if election.status == 'completed' %}selected{% endif %}>Completed</option>
                            </select>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary">Update Election</button>
                            <div>
                                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                                <button type="button" class="btn btn-danger" 
                                        onclick="confirmDeleteElection('{{ election._id|string }}', '{{ election.title }}')">
                                    <i class="fas fa-trash"></i> Delete Election
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="deleteElectionModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Deletion</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body" id="deleteElectionModalBody">
        Are you sure you want to delete this election? This action cannot be undone.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button
          type="button"
          class="btn btn-danger"
          id="confirmDeleteElectionBtn"
        >
          Delete Election
        </button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const startDate = document.getElementById('start_date');
    const endDate = document.getElementById('end_date');
    
    startDate.addEventListener('change', function() {
        endDate.min = this.value;
    });
});

function confirmDeleteElection(electionId, electionTitle) {
  document.getElementById('deleteElectionModalBody').innerHTML = 
    `Are you sure you want to delete the election <strong>${electionTitle}</strong>?<br><br>
     This action cannot be undone and will remove all votes and data associated with this election.`;
  const confirmBtn = document.getElementById('confirmDeleteElectionBtn');
  confirmBtn.onclick = function() {
    deleteElection(electionId);
  };
  
  const deleteModal = new bootstrap.Modal(document.getElementById('deleteElectionModal'));
  deleteModal.show();
}

function deleteElection(electionId) {
  fetch(`/admin/election/delete/${electionId}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
    }
  })
  .then(response => {
    if (!response.ok) {
      throw new Error('Network response was not ok');
    }
    return response.json();
  })
  .then(data => {
    if (data.success) {
      window.location.href = '/admin_dashboard';
    } else {
      alert(data.error || 'Failed to delete election');
    }
  })
  .catch(error => {
    console.error('Error:', error);
    alert('An error occurred while deleting the election');
  });
}
</script>
{% endblock %}
